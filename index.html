<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>首都城南エリア OODA育成ボード</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>首都城南エリア OODA育成ボード</h1>
      <p>6店舗の実績・OODA・育成・アイデアを週間／月間で可視化</p>
    </div>
    <button id="exportBtn" class="btn secondary">CSV出力</button>
  </header>

  <nav class="tabs" aria-label="画面切替">
    <button class="tab active" data-view="ranking">週間ランキング</button>
    <button class="tab" data-view="store">店舗詳細</button>
    <button class="tab" data-view="ideas">アイデア共有</button>
    <button class="tab" data-view="monthly">月次振り返り</button>
  </nav>

  <main>
    <section id="ranking" class="view active">
      <div class="toolbar">
        <label>対象週 <input id="weekInput" type="week" /></label>
        <button id="seedWeekBtn" class="btn secondary">サンプル初期化</button>
      </div>
      <div class="cards" id="summaryCards"></div>
      <div class="panel">
        <div class="panel-title-row">
          <h2>週間総合ランキング</h2>
          <small>実績50点 + OODA20点 + 育成10点 + アイデア10点 + コミット10点</small>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>順位</th><th>店舗</th><th>前週</th><th>仮想受注</th><th>計画比</th><th>OODA</th><th>育成</th><th>アイデア</th><th>コミット</th><th>総合</th></tr>
            </thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>今週の注目</h2>
        <div id="weeklyHighlights" class="highlight-grid"></div>
      </div>
    </section>

    <section id="store" class="view">
      <div class="toolbar">
        <label>店舗
          <select id="storeSelect"></select>
        </label>
        <label>対象週 <input id="storeWeekInput" type="week" /></label>
      </div>
      <div class="panel form-panel">
        <div class="form-grid two">
          <label>店舗総仮想受注（円）<input id="virtualOrders" type="number" min="0" step="1000" /></label>
          <label>計画比（%）<input id="planRatio" type="number" min="0" step="0.1" /></label>
          <label>前週順位<input id="prevRank" type="number" min="1" max="6" /></label>
          <label>今週のテーマ<input id="weeklyTheme" type="text" /></label>
        </div>

        <h3>OODA・育成チェック</h3>
        <div class="score-grid">
          <label>Observe / 5<input id="observeScore" type="number" min="0" max="5" /></label>
          <label>Orient / 5<input id="orientScore" type="number" min="0" max="5" /></label>
          <label>Decide / 5<input id="decideScore" type="number" min="0" max="5" /></label>
          <label>Act / 5<input id="actScore" type="number" min="0" max="5" /></label>
          <label>育成 / 10<input id="trainingScore" type="number" min="0" max="10" /></label>
          <label>アイデア / 10<input id="ideaScore" type="number" min="0" max="10" /></label>
          <label>コミット / 10<input id="commitScore" type="number" min="0" max="10" /></label>
        </div>

        <div class="form-grid two">
          <label>先週のACT<textarea id="lastAct" rows="3"></textarea></label>
          <label>実績・結果<textarea id="resultText" rows="3"></textarea></label>
          <label>良かった部分<textarea id="goodText" rows="3"></textarea></label>
          <label>課題だった部分<textarea id="issueText" rows="3"></textarea></label>
          <label>これから育成する部分<textarea id="trainingText" rows="3"></textarea></label>
          <label>今週のコミット<textarea id="commitText" rows="3"></textarea></label>
          <label>今週のアイデア<textarea id="ideaText" rows="3"></textarea></label>
          <label>実際に取り組んだこと<textarea id="actionTaken" rows="3"></textarea></label>
          <label>アイデアの結果<textarea id="ideaResult" rows="3"></textarea></label>
          <label>AMコメント<textarea id="amComment" rows="3"></textarea></label>
        </div>
        <div class="action-row">
          <button id="saveStoreBtn" class="btn primary">保存</button>
          <button id="copyDailyBtn" class="btn secondary">日報用まとめを作成</button>
        </div>
        <div id="saveMessage" class="message" aria-live="polite"></div>
        <textarea id="dailyOutput" class="output" rows="5" readonly placeholder="ここに日報用まとめが表示されます"></textarea>
      </div>
    </section>

    <section id="ideas" class="view">
      <div class="toolbar">
        <label>対象週 <input id="ideaWeekInput" type="week" /></label>
      </div>
      <div id="ideaList" class="idea-list"></div>
    </section>

    <section id="monthly" class="view">
      <div class="toolbar">
        <label>対象月 <input id="monthInput" type="month" /></label>
        <label>店舗 <select id="monthStoreSelect"></select></label>
      </div>
      <div class="cards" id="monthCards"></div>
      <div class="panel form-panel">
        <div class="form-grid two">
          <label>今月良かった部分<textarea id="monthGood" rows="4"></textarea></label>
          <label>今月の課題<textarea id="monthIssue" rows="4"></textarea></label>
          <label>これから育成する部分<textarea id="monthTraining" rows="4"></textarea></label>
          <label>実績総括<textarea id="monthResult" rows="4"></textarea></label>
          <label>来月コミット<textarea id="monthCommit" rows="4"></textarea></label>
          <label>全店横展開したいアイデア<textarea id="monthIdea" rows="4"></textarea></label>
        </div>
        <div class="checklist">
          <label><input id="m1" type="checkbox" /> 計画実績を達成できた</label>
          <label><input id="m2" type="checkbox" /> 先月課題を改善できた</label>
          <label><input id="m3" type="checkbox" /> 個人フォーカスができた</label>
          <label><input id="m4" type="checkbox" /> プロセスフォーカスができた</label>
          <label><input id="m5" type="checkbox" /> 先週行動→今週行動がつながった</label>
          <label><input id="m6" type="checkbox" /> 店長・リーダーが自力でOODAを回せた</label>
        </div>
        <button id="saveMonthBtn" class="btn primary">月次振り返り保存</button>
        <div id="monthMessage" class="message" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
